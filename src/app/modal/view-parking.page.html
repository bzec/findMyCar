<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Parking details</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" aria-label="Close parking details">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="parking-hero">
    <ion-icon name="car-sport" aria-hidden="true"></ion-icon>
    <h1>{{ entry.value.name?.trim() || 'Unnamed parking' }}</h1>
  </div>

  @if (entry.value.pictureData) {
    <ion-img
      class="parking-photo"
      [src]="entry.value.pictureData"
      alt="Photo taken at the parking location"
    ></ion-img>
  }

  <ion-list inset="true">
    <ion-item>
      <ion-icon slot="start" name="time-outline" aria-hidden="true"></ion-icon>
      <ion-label>
        <p>Parking duration</p>
        <h3>{{ entry.value.duration }}</h3>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-icon slot="start" name="calendar-outline" aria-hidden="true"></ion-icon>
      <ion-label>
        <p>Parked since</p>
        <h3>{{ entry.value.date | date: 'medium' }}</h3>
      </ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-icon slot="start" name="location-outline" aria-hidden="true"></ion-icon>
      <ion-label>
        <p>Coordinates</p>
        <h3>{{ coordinates }}</h3>
      </ion-label>
      <ion-note slot="end">lat, lng</ion-note>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <div class="footer-actions">
      <ion-button fill="outline" (click)="copyCoordinates()">
        <ion-icon slot="start" name="copy-outline"></ion-icon>
        Copy
      </ion-button>
      <ion-button (click)="openInMap()">
        <ion-icon slot="start" name="navigate-outline"></ion-icon>
        Open in map
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
