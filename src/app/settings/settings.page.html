<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>History</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-icon slot="start" name="archive-outline" aria-hidden="true"></ion-icon>
      <ion-toggle
        [ngModel]="historyEnabled"
        (ionChange)="onHistoryChange($any($event).detail.checked)"
      >
        Save parking history
      </ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon
        slot="start"
        name="calendar-clear-outline"
        aria-hidden="true"
      ></ion-icon>
      <ion-select
        label="Auto-delete history"
        [ngModel]="frequency"
        (ionChange)="onFrequencyChange($any($event).detail.value)"
        interface="popover"
      >
        <ion-select-option value="0">Never</ion-select-option>
        <ion-select-option value="3">After 3 months</ion-select-option>
        <ion-select-option value="12">After 1 year</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>

  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Parking alert</ion-label>
    </ion-list-header>

    <ion-item lines="none">
      <ion-icon slot="start" name="alarm-outline" aria-hidden="true"></ion-icon>
      <ion-label class="ion-text-wrap">
        <p>Get notified once your car has been parked for this long.</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-input
        type="number"
        label="Hours"
        labelPlacement="stacked"
        placeholder="0"
        min="0"
        max="23"
        [ngModel]="hours"
        (ionChange)="onHoursChange($any($event).detail.value)"
      ></ion-input>
      <ion-input
        type="number"
        label="Minutes"
        labelPlacement="stacked"
        placeholder="0"
        min="0"
        max="59"
        [ngModel]="minutes"
        (ionChange)="onMinutesChange($any($event).detail.value)"
      ></ion-input>
    </ion-item>
  </ion-list>

  <ion-list inset="true">
    <ion-list-header>
      <ion-label color="danger">Danger zone</ion-label>
    </ion-list-header>

    <ion-item lines="none">
      <ion-icon
        slot="start"
        name="warning-outline"
        color="danger"
        aria-hidden="true"
      ></ion-icon>
      <ion-label class="ion-text-wrap">
        <ion-text color="medium">
          <p>These actions cannot be undone.</p>
        </ion-text>
      </ion-label>
    </ion-item>

    <div class="danger-actions">
      <ion-button expand="block" fill="outline" color="danger" (click)="clearList()">
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Clear parking list
      </ion-button>
      <ion-button expand="block" color="danger" (click)="clearAll()">
        <ion-icon slot="start" name="trash-bin-outline"></ion-icon>
        Reset the app
      </ion-button>
    </div>
  </ion-list>
</ion-content>
